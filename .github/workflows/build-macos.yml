name: Build macOS app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: head3Dv1.app (Apple Silicon)
    runs-on: macos-15            # arm64
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            upstream/requirements.txt
            requirements-build.txt

      - name: Decide version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build, self-test, check and package
        run: PYTHON="$(command -v python)" ./build.sh

      - name: Update self-test (TLS to GitHub, DMG -> swap)
        run: |
          dist/head3Dv1.app/Contents/MacOS/head3Dv1 --self-test-update \
            --dmg "dist/head3Dv1-${APP_VERSION}-arm64.dmg"

      - name: Launcher tests
        run: .venv-build/bin/python -m pytest tests -q -p no:cacheprovider

      - name: Upstream tests (dependency set on arm64)
        working-directory: upstream
        run: ../.venv-build/bin/python -m pytest tests -q -p no:cacheprovider

      - name: Upstream is untouched
        run: |
          git -C upstream status --porcelain
          test -z "$(git -C upstream status --porcelain)"
          test "$(git -C upstream rev-parse HEAD)" = "$(git ls-tree HEAD upstream | awk '{print $3}')"

      - uses: actions/upload-artifact@v4
        with:
          name: head3Dv1-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ~/Library/Logs/head3Dv1/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: head3Dv1-arm64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
          generate_release_notes: true
